<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Gather Link</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #07111f;
      --panel: rgba(19, 34, 58, .78);
      --line: rgba(164, 190, 255, .16);
      --text: #edf3ff;
      --muted: #a9b8d3;
      --cyan: #70e6ed;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      background:
        radial-gradient(ellipse at 72% 4%, #243667 0, transparent 40%),
        radial-gradient(ellipse at 5% 78%, #153e53 0, transparent 35%),
        var(--background);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .wrap { max-width: 760px; margin: auto; }
    .brand { color: var(--cyan); font-size: 13px; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 14px 0 10px; font-size: clamp(32px, 7vw, 52px); line-height: 1.06; letter-spacing: -.04em; }
    .sub { margin: 0 0 28px; color: var(--muted); }
    .panel {
      margin: 16px 0;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 20px 70px #02081755;
      backdrop-filter: blur(20px);
    }
    .hidden { display: none !important; }
    .label { color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .pairrow, .file, .toolbar { display: flex; align-items: center; gap: 12px; }
    .pairrow { margin-top: 12px; }
    input[type="text"] {
      min-width: 0;
      flex: 1;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #091425;
      color: var(--text);
      font-size: 20px;
      letter-spacing: .24em;
      text-align: center;
    }
    button, .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(120deg, #8d75ff, #65dce9);
      color: #081221;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }
    button.secondary {
      border: 1px solid var(--line);
      background: rgba(164, 190, 255, .12);
      color: var(--text);
    }
    .toolbar { justify-content: space-between; flex-wrap: wrap; }
    .file { justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); }
    .file:first-child { border-top: 0; }
    .fileinfo { min-width: 0; overflow: hidden; }
    .filename { overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .filesize { color: var(--muted); font-size: 12px; }
    .status { min-height: 24px; color: var(--cyan); font-size: 14px; }
    .status.error { color: #ff9eac; }
    .empty { padding: 16px 0; color: var(--muted); }
    .note { margin-top: 14px; color: var(--muted); font-size: 12px; }
    .drop {
      display: block;
      width: 100%;
      padding: 18px;
      border: 1px dashed rgba(164, 190, 255, .32);
      border-radius: 16px;
      color: var(--muted);
      text-align: center;
      cursor: pointer;
    }
    .drop input { display: none; }

    @media (max-width: 520px) {
      body { padding: 22px 14px; }
      .panel { padding: 17px; }
      .pairrow { align-items: stretch; flex-direction: column; }
      .pairrow button, .file button { width: 100%; }
      .file { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">Gather Link</div>
    <h1>你的设备，<br>现在连在一起。</h1>
    <p class="sub">通过同一 Wi‑Fi，在手机、平板和电脑之间直接传送文件。</p>

    <section id="pair" class="panel">
      <div class="label">输入手机上的 6 位配对码</div>
      <form id="pairForm" class="pairrow">
        <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="••••••" required>
        <button type="submit">连接设备</button>
      </form>
      <p id="pairStatus" class="status" role="status"></p>
      <p class="note">配对码只在当前会话有效。请在可信 Wi‑Fi 下使用，并只与信任的设备共享。</p>
    </section>

    <section id="workspace" class="hidden">
      <div class="panel">
        <div class="toolbar">
          <div>
            <div class="label">此设备共享的文件</div>
            <div id="sharedCount" class="filesize"></div>
          </div>
          <button class="secondary" id="refresh">刷新</button>
        </div>
        <div id="sharedList" style="margin-top: 12px"></div>
      </div>

      <div class="panel">
        <div class="label">互联收件箱</div>
        <div class="filesize">本次会话收到，已配对设备均可下载</div>
        <div id="inboxList" style="margin-top: 12px"></div>
      </div>

      <div class="panel">
        <div class="label">发送文件到手机</div>
        <label class="drop">选择文件<input id="upload" type="file" multiple></label>
        <p id="uploadStatus" class="status" role="status"></p>
        <p class="note">收到的文件会暂存在手机收件箱；你可以在手机上另存，也可以让本次会话的其他设备下载。</p>
      </div>
    </section>
  </main>

  <script>
    const $ = (selector) => document.querySelector(selector);
    const pair = $("#pair");
    const workspace = $("#workspace");
    let pollTimer = null;

    function message(element, text, isError = false) {
      element.textContent = text;
      element.classList.toggle("error", isError);
    }

    function formatSize(bytes) {
      if (bytes == null) return "大小未知";
      const units = ["B", "KB", "MB", "GB"];
      let value = bytes;
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit += 1;
      }
      return `${value < 10 && unit ? value.toFixed(1) : Math.round(value)} ${units[unit]}`;
    }

    async function requestJson(path) {
      const response = await fetch(path);
      const data = await response.json().catch(() => ({}));
      if (response.status === 401) {
        resetPairing();
        throw new Error("配对已失效，请输入手机上新显示的配对码。");
      }
      if (!response.ok) throw new Error(data.error || "连接失败");
      return data;
    }

    function resetPairing() {
      pair.classList.remove("hidden");
      workspace.classList.add("hidden");
      if (pollTimer) window.clearInterval(pollTimer);
      pollTimer = null;
    }

    function renderFiles(container, files, path, emptyText) {
      const list = $(container);
      list.replaceChildren();
      if (!files.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = emptyText;
        list.append(empty);
        return;
      }

      for (const file of files) {
        const row = document.createElement("div");
        row.className = "file";
        const info = document.createElement("div");
        info.className = "fileinfo";
        const title = document.createElement("div");
        title.className = "filename";
        title.textContent = file.name;
        const meta = document.createElement("div");
        meta.className = "filesize";
        meta.textContent = formatSize(file.size);
        info.append(title, meta);

        const download = document.createElement("a");
        download.className = "button";
        download.href = `${path}/${encodeURIComponent(file.id)}`;
        download.textContent = "下载";
        row.append(info, download);
        list.append(row);
      }
    }

    async function loadInbox() {
      const files = await requestJson("/api/inbox");
      renderFiles("#inboxList", files, "/api/inbox", "本次会话还没有收到文件。");
    }

    async function loadFiles() {
      try {
        const files = await requestJson("/api/files");
        $("#sharedCount").textContent = `${files.length} 个文件`;
        renderFiles("#sharedList", files, "/api/files", "手机还没有选择共享文件。");
        await loadInbox();
      } catch (error) {
        message($("#uploadStatus"), error.message || "连接失败", true);
      }
    }

    async function sendFile(file) {
      return new Promise((resolve, reject) => {
        const request = new XMLHttpRequest();
        request.open("POST", "/api/upload?name=" + encodeURIComponent(file.name));
        request.upload.addEventListener("progress", (event) => {
          if (event.lengthComputable) {
            const percent = Math.round((event.loaded / event.total) * 100);
            message($("#uploadStatus"), `${file.name} · ${percent}%`);
          }
        });
        request.onload = () => {
          let response = {};
          try { response = JSON.parse(request.responseText); } catch (_) {}
          if (request.status >= 200 && request.status < 300) resolve();
          else reject(new Error(response.error || `发送失败：${file.name}`));
        };
        request.onerror = () => reject(new Error(`网络中断：${file.name}`));
        request.send(file);
      });
    }

    $("#pairForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const status = $("#pairStatus");
      message(status, "正在连接…");
      try {
        const response = await fetch("/api/pair", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ code: $("#code").value }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "配对失败");
        pair.classList.add("hidden");
        workspace.classList.remove("hidden");
        await loadFiles();
        if (!pollTimer) pollTimer = window.setInterval(loadFiles, 5000);
      } catch (error) {
        message(status, error.message || "连接失败，请检查配对码和网络。", true);
      }
    });

    $("#refresh").addEventListener("click", loadFiles);
    $("#upload").addEventListener("change", async (event) => {
      const files = [...event.target.files];
      try {
        for (let index = 0; index < files.length; index += 1) {
          message($("#uploadStatus"), `发送 ${index + 1}/${files.length}：${files[index].name}`);
          await sendFile(files[index]);
        }
        message($("#uploadStatus"), files.length ? `已发送 ${files.length} 个文件。` : "");
        await loadFiles();
      } catch (error) {
        message($("#uploadStatus"), error.message || "发送失败", true);
      } finally {
        event.target.value = "";
      }
    });
  </script>
</body>
</html>
